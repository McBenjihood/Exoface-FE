name: Build Vue Release

on:
push:
branches:
  - releases

permissions:
contents: write

jobs:
build-and-deploy:
runs-on: ubuntu-latest

steps:
  - name: Checkout releases branch
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Build Vue project
    run: npm run build

  - name: Save build
    run: |
      cp -r dist /tmp/vue-dist

  - name: Configure Git
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

  - name: Switch to main
    run: |
      git fetch origin main
      git checkout main
      git reset --hard origin/main

  - name: Replace build
    run: |
      rm -rf dist
      cp -r /tmp/vue-dist dist

  - name: Commit and push
    run: |
      git add dist
      git diff --cached --quiet || git commit -m "chore: update production build"
      git push origin main
